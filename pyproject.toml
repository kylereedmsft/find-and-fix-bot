[project]
name = "find-and-fix-bot"
version = "0.1.0"
description = "Standalone GitHub Copilot SDK harness: continuously scans a local repo for configurable patterns (units of work), investigates each match, and proposes a fix you can apply from an interactive TUI."
requires-python = ">=3.11"
dependencies = [
    "github-copilot-sdk>=1.0.5",
    "textual>=0.80",
    "rich>=13.7",
]

[project.optional-dependencies]
# Structural "laser-focus" refiner for the fix span. Optional — the scanner
# falls back to a line window when tree-sitter isn't installed.
treesitter = [
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.9",
]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.scripts]
find-and-fix = "findfix.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["findfix"]

[tool.setuptools.package-data]
findfix = ["skills/**/*.md"]
